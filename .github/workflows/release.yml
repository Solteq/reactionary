name: release

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - 'README.md'
      - 'documentation/**'
      - '**/*.md'

    branches:
      - main

  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read
  id-token: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org/

      - run: pnpm install

      # A manual run uses the chosen bump. A push to main is a minor release when any commit since the last release tag has a
      # `feat:` or `feat(` subject (`feat!:` included), and a patch release otherwise.
      - name: Determine version bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.version_bump }}
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          else
            range="${last_tag:+$last_tag..HEAD}"
            if git log $range --format=%s | grep -Eq '^feat(\(|!|:)'; then
              bump=minor
            else
              bump=patch
            fi
          fi
          echo "Releasing a $bump version (last tag: ${last_tag:-none})"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Release
        run: |
          git config --global user.email "martin.rogne@solteq.com"
          git config --global user.name "Martin Rogne"
          pnpm exec nx release "$VERSION_BUMP" --yes -- --no-agents
        env:
          VERSION_BUMP: ${{ steps.bump.outputs.bump }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: true
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_WRITE_ACCESS_TOKEN }}
